<div class="confirmation-modal">
  <mat-dialog-content>
    Are you sure you want to delete all of your applications?
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button class="btn btn-outline-secondary" id="cancel-btn" (click)="onCancel()">Cancel</button>
    <button class="btn" id="delete-btn" (click)="deleteAllClicked()">Delete</button>
  </mat-dialog-actions>
</div>
