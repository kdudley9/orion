<div class="card">
  <div class="card-body d-flex">
    <div class="container">
      <mat-icon>business</mat-icon>
    </div>
    <div class="container">
      <h5 class="card-title">{{ application().jobTitle }}</h5>
      <p class="card-text">{{ application().company }}</p>
      <p class="card-text">{{ application().industry }}</p>
    </div>
    <div class="container">
      <p class="card-text">{{ application().location }}</p>
      <p class="card-text">{{ application().dateApplied }}</p>
    </div>
    <div class="container d-flex flex-column">
      <mat-icon>more_horiz</mat-icon>
      <mat-icon>star-border</mat-icon>
    </div>
  </div>
  <button class="btn-primary">
    Update Status <mat-icon>expand_more</mat-icon>
  </button>
</div>
