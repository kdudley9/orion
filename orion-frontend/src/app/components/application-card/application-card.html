<div class="card">
  <div class="card-body d-flex">
    <div class="container">
      <mat-icon>business</mat-icon>
    </div>
    <div class="container">
      <h5 class="card-title" (click)="navigateToApplicationDetails(application().id)">{{ application().jobTitle }}</h5>
      <p class="card-text">{{ application().company }}</p>
      <p class="card-text">{{ application().industry | removeUnderscores }}</p>
    </div>
    <div class="container">
      <p class="card-text">{{ application().location }}</p>
      <p class="card-text">{{ application().dateApplied | date: 'shortDate'}}</p>
      <p class="card-text">{{ application().jobType | removeUnderscores}}</p>
    </div>
    <div class="container d-flex flex-column">
      <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="More">
        <mat-icon>more_horiz</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item>UPDATE</button>
        <button mat-menu-item (click)="deleteApplication(application().id)">DELETE</button>
      </mat-menu>
      <mat-icon>star-border</mat-icon>
    </div>
    <select class="form-select" (change)="onPatchApplication(application().id, $any($event.target).value)">
      @for (status of statuses; track $index) {
        <option [value]="status">{{ status | removeUnderscores}}</option>
      }
    </select>
  </div>
</div>
