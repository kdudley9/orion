<div class="card mb-3">
  <div class="card-body d-flex flex-row">
    <p class="question pe-4">{{ question().question }}</p>
    @if (question().note) {
        <quill-view [content]="question().note" format="html"></quill-view>
    } @else {
        <p class="note ps-4 text-muted">No notes yet...</p>
    }
    <div class="more-btn-container">
        <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="More">
          <mat-icon>more_horiz</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          @if (!question().aiGenerated) {
            <button mat-menu-item (click)="onUpdateQuestion()">UPDATE</button> 
          }
          <button mat-menu-item (click)="deleteQuestion()">DELETE</button>
        </mat-menu>
    </div>
  </div>
</div>
