<div class="container">
  <h1>Interview Details Placeholder</h1>
  @for(interview of interviews; track interview.id) {
    <p>{{ interview.interviewDate }}</p>
    <p>{{ interview.interviewType }}</p>
    <p>{{ interview.location }}</p>
    <p>{{ interview.meetingLink }}</p>
    <p>{{ interview.interviewers }}</p>
  }
  <button class="btn btn-primary" (click)="openInterviewForm(applicationId)">Add Interview</button>
</div>
