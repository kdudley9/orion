<div class="container-fluid">
  <div class="header">
    <a routerLink="/applications" class="text-muted" id="applications-nav">
      <mat-icon>arrow_back</mat-icon>
      <span>Back to applications</span>
    </a>
    <h1>Application Details</h1>
    <p>Some lorem ipsum text here, for the time being.</p>
  </div>
  <div class="container" id="details-container">
    <ul class="nav nav-fill mb-3">
      <li class="nav-item me-3">
        <a class="nav-link active" [ngClass]="{ 'active':activeTab==='applicationDetails'}" (click)="applicationDetalisTabClicked('applicationDetails')" data-toggle="tab">Details</a>
      </li>
      <li class="nav-item me-3">
        <a class="nav-link">Interviews</a>
      </li>
      <li class="nav-item me-3">
        <a class="nav-link" [ngClass]="{ 'active':activeTab==='practiceQuestions'}" (click)="practiceQuestionsTabClicked('practiceQuestions')" data-toggle="tab">Practice Questions</a>
      </li>
    </ul>
    <div id="main-content">
      @switch (activeTab) {
        @case ('applicationDetails') {
          <app-application-info />
        }
        @case ('practiceQuestions') {
          <app-interview-question-page />
        }
      }
    </div>
  </div>
</div>
